name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: for proj in src/*/*.csproj tests/*/*.csproj; do dotnet build "$proj" -c Release; done

      - name: Test
        run: dotnet test --test-modules "**/bin/Release/**/*.Tests.dll"
